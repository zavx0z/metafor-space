<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>node-meta-param</title>
  <link rel="stylesheet" href="../theme.css"/>
  <link rel="stylesheet" href="../dev/style.css"/>
  <style>
    body {
      flex-direction: column;
      gap: 12px;
    }

    section {
      padding: 8px;
      display: flex;
      position: relative;
      background-color: var(--background-color);
    }
  </style>
  <script type="module">
    import "./node-meta-param.js"
    import {html, render} from "../../html/html.js"

    render(html`
      <section>
        <metafor-node-meta-param context=${{
          tag: "snapshot.id",
          state: "i",
          param: "key",
          title: "Очень длинное название параметра",
          value: 4444
        }}></metafor-node-meta-param>
      </section>
      <section>
        <metafor-node-meta-param context=${{
          tag: "snapshot.id",
          state: "i",
          param: "key",
          title: "Короткое название",
          value: 4444
        }}></metafor-node-meta-param>
      </section>
    `, document.body)
  </script>
</head>
<body>

</body>
</html>
