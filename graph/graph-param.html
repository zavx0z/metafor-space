<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>graph-param</title>
  <link rel="stylesheet" href="/theme/theme.css"/>
  <link rel="stylesheet" href="index.css"/>
  <style>
    body {
      flex-direction: column;
      gap: 12px;
    }

    section {
      padding: 8px;
      display: flex;
      position: relative;
      border-radius: var(--node-border-radius);
      background-color: var(--background-color);
    }
  </style>
  <script type="module">
    import "./graph-param.js"
    import {html, render} from "../html/html.js"

    render(html`
      <section>
        <metafor-graph-param context=${{
          id: "snapshot.id",
          state: "i",
          param: "key",
          title: "Очень длинное название параметра",
          value: 4444
        }}></metafor-graph-param>
      </section>
      <section>
        <metafor-graph-param context=${{
          id: "snapshot.id",
          state: "i",
          param: "key",
          title: "Короткое название",
          value: 4444
        }}></metafor-graph-param>
      </section>
    `, document.body)
  </script>
</head>
<body>

</body>
</html>
