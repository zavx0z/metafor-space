<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8"/>
  <title>node-meta-condition</title>
  <link rel="stylesheet" href="/theme/theme.css"/>
  <link rel="stylesheet" href="index.css"/>
  <style>
    div {
      background-color: rgba(var(--surface-400));
      position: relative;
      display: flex;
      border-radius: 8px;
      align-items: center;
      width: 100px;
      height: 24px;
    }
  </style>
  <script type="module">
    import "./graph-socket.js"
    import {html, render} from "../html/html.js"

    document.body.addEventListener("channel", (ev) => {
      const {meta, patch} = ( /**@type {CustomEvent}*/ (ev)).detail
      console.log(meta, patch)
    })
    const context = {
      id: "id meta",
      state: "state meta",
      param: "context parameter",
      direction: "west",
      parent: "condition"
    }
    render(
      html`
        <div>
          <metafor-graph-socket
          disabled
            context=${{...context, direction: "west"}}
          ></metafor-graph-socket>
          <metafor-graph-socket
            class="connected"
            context=${{...context, direction: "east"}}
          ></metafor-graph-socket>
        </div>
      `,
      document.body
    )
  </script>
</head>
<body></body>
</html>
