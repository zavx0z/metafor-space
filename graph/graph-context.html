<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>graph-context storybook</title>
  <link rel="preload" href="/theme/RussoOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Russo One";
      src: url("/theme/RussoOne-Regular.woff2") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    code, .monospace {
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
    }
  </style>
  <link rel="stylesheet" href="/theme/theme.css"/>
  <link rel="stylesheet" href="index.css"/>
  <style>
    body {
      flex-direction: column;
      gap: 12px;
    }
    section {
      padding: 8px;
      display: flex;
      position: relative;
      border-radius: var(--node-border-radius);
      background-color: var(--background-color);
      margin-bottom: 8px;
    }
    h2 {
      color: var(--font-color);
      font-size: 1em;
      margin: 0 0 4px 0;
      font-weight: 400;
    }
  </style>
  <script type="module">
    await import("./graph-context.js")
    import {html, render} from "../html/html.js"

    render(html`
        <metafor-graph-context context=${{id: "ctx1", state: "name state"}}>
          ${[
            {param: "name", title: "Имя пользователя", value: "Иван", type: "string"},
            {param: "age", title: "Возраст", value: 42, type: "number"},
            {param: "active", title: "Активен?", value: "true", type: "boolean"},
            {param: "tags", title: "Теги", value: ["a","b","c"], type: "array"},
            {param: "role", title: "Роль", value: "admin,user,guest", type: "enum"},
          ].map(p => html`
            <metafor-graph-param context=${{id: "ctx1", state: "i", ...p}}></metafor-graph-param>
          `)}
        </metafor-graph-context>
    `, document.body)
  </script>
</head>
<body>
</body>
</html>
