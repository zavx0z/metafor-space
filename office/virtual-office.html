<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>MetaFor Virtual Office - Виртуальный офис</title>
  
      <script src="lib/three.min.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  
  <script>
    // Встроенные OrbitControls (упрощенная версия)
    THREE.OrbitControls = class OrbitControls {
      constructor(camera, domElement) {
        this.camera = camera
        this.domElement = domElement || document
        this.enabled = true
        
        this.target = new THREE.Vector3()
        this.minDistance = 0
        this.maxDistance = Infinity
        this.enableDamping = true
        this.dampingFactor = 0.05
        this.enableZoom = true
        this.zoomSpeed = 1.0
        this.enableRotate = true
        this.rotateSpeed = 1.0
        
        this.spherical = new THREE.Spherical()
        this.sphericalDelta = new THREE.Spherical()
        this.scale = 1
        
        this.state = { NONE: -1, ROTATE: 0, DOLLY: 1 }
        this.currentState = this.state.NONE
        
        this.rotateStart = new THREE.Vector2()
        this.rotateEnd = new THREE.Vector2()
        this.rotateDelta = new THREE.Vector2()
        
        this.dollyStart = new THREE.Vector2()
        this.dollyEnd = new THREE.Vector2()
        this.dollyDelta = new THREE.Vector2()
        
        this.bindEvents()
        this.update()
      }
      
      bindEvents() {
        this.domElement.addEventListener('contextmenu', (e) => e.preventDefault())
        this.domElement.addEventListener('mousedown', this.onMouseDown.bind(this))
        this.domElement.addEventListener('wheel', this.onMouseWheel.bind(this))
      }
      
      onMouseDown(event) {
        if (!this.enabled) return
        event.preventDefault()
        
        if (event.button === 0) {
          this.currentState = this.state.ROTATE
          this.rotateStart.set(event.clientX, event.clientY)
        }
        
        this.domElement.addEventListener('mousemove', this.onMouseMove.bind(this))
        this.domElement.addEventListener('mouseup', this.onMouseUp.bind(this))
      }
      
      onMouseMove(event) {
        if (!this.enabled) return
        event.preventDefault()
        
        if (this.currentState === this.state.ROTATE) {
          this.rotateEnd.set(event.clientX, event.clientY)
          this.rotateDelta.subVectors(this.rotateEnd, this.rotateStart).multiplyScalar(this.rotateSpeed)
          
          this.sphericalDelta.theta -= 2 * Math.PI * this.rotateDelta.x / this.domElement.clientHeight
          this.sphericalDelta.phi -= 2 * Math.PI * this.rotateDelta.y / this.domElement.clientHeight
          
          this.rotateStart.copy(this.rotateEnd)
          this.update()
        }
      }
      
      onMouseUp() {
        if (!this.enabled) return
        this.domElement.removeEventListener('mousemove', this.onMouseMove.bind(this))
        this.domElement.removeEventListener('mouseup', this.onMouseUp.bind(this))
        this.currentState = this.state.NONE
      }
      
      onMouseWheel(event) {
        if (!this.enabled || !this.enableZoom) return
        event.preventDefault()
        
        if (event.deltaY < 0) {
          this.scale /= Math.pow(0.95, this.zoomSpeed)
        } else if (event.deltaY > 0) {
          this.scale *= Math.pow(0.95, this.zoomSpeed)
        }
        
        this.update()
      }
      
      update() {
        const offset = new THREE.Vector3()
        offset.copy(this.camera.position).sub(this.target)
        
        this.spherical.setFromVector3(offset)
        
        this.spherical.theta += this.sphericalDelta.theta
        this.spherical.phi += this.sphericalDelta.phi
        
        this.spherical.phi = Math.max(0.000001, Math.min(Math.PI - 0.000001, this.spherical.phi))
        this.spherical.radius *= this.scale
        this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius))
        
        offset.setFromSpherical(this.spherical)
        this.camera.position.copy(this.target).add(offset)
        this.camera.lookAt(this.target)
        
        if (this.enableDamping) {
          this.sphericalDelta.theta *= (1 - this.dampingFactor)
          this.sphericalDelta.phi *= (1 - this.dampingFactor)
        } else {
          this.sphericalDelta.set(0, 0, 0)
        }
        
        this.scale = 1
      }
    }
    
               // GLTFLoader теперь загружен локально
  </script>

      margin: 0;

<body>
  <div id="office-container"></div>
  
  <div id="ui-overlay">
    <h1>Virtual Office</h1>
    <p>Виртуальный офис MetaFor</p>
    <p><strong>Размер:</strong> 8м × 6м × 3м</p>
    <p><strong>Освещение:</strong> Дневной свет + точечные источники</p>
    <p><strong>Управление:</strong> Мышь для вращения камеры</p>
  </div>
  
  <div id="controls">
    <button onclick="addWorkstation()">Добавить рабочее место</button>
    <button onclick="toggleLighting()">Освещение</button>
    <button onclick="addMetaScreen()">MetaFor экран</button>
    <button onclick="addHumanoid()">Добавить сотрудника 🤖</button>
    <button onclick="toggleDay()">День/Ночь</button>
  </div>
  
  <div id="info">
    <div><strong>FPS:</strong> <span id="fps">60</span></div>
    <div><strong>Объекты:</strong> <span id="objects">0</span></div>
    <div><strong>Сотрудники:</strong> <span id="humanoids">0</span></div>
    <div><strong>Освещение:</strong> <span id="lights">Дневное</span></div>
    <div><strong>Время:</strong> <span id="time">12:00</span></div>
  </div>

  <script>
    // Ждем загрузки глобальных скриптов
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initOffice, 300) // Даем время для загрузки скриптов
    })
    
    function initOffice() {
              if (!window.THREE || !window.THREE.OrbitControls || !window.THREE.GLTFLoader) {
        console.log('⏳ Ждем загрузки Three.js скриптов...')
        setTimeout(initOffice, 100)
        return
      }
      
      console.log('✅ Three.js скрипты загружены, запускаем офис...')
      window.office = new VirtualOffice()
      
      console.log(`
      🏢 MetaFor Virtual Office запущен!
      
      ✅ Офис-студия 8м × 6м × 3м создан
      ✅ Базовая мебель размещена
      ✅ Освещение настроено
      ✅ Анимированные сотрудники загружаются...
      ✅ Интерактивность добавлена
      
      Управление:
      - Мышь: вращение камеры
      - Колесо: приближение/отдаление
      - Кнопки: добавление объектов и сотрудников
      `)
    }
    
    // Виртуальный офис-студия MetaFor
    class VirtualOffice {
      constructor() {
        this.scene = new THREE.Scene()
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000)
        this.renderer = new THREE.WebGLRenderer({ antialias: true })
        this.controls = null
        
        this.workstations = []
        this.metaScreens = []
        this.humanoids = []
        this.mixers = []
        this.clock = new THREE.Clock()
        this.gltfLoader = new THREE.GLTFLoader()
        this.isDayTime = true
        this.lightingEnabled = true
        
        this.frameCount = 0
        this.lastTime = performance.now()
        
        this.init()
        this.createOfficeStructure()
        this.createFurniture()
        this.setupLighting()
        this.setupControls()
        this.loadInitialHumanoids()
        this.animate()
      }
      
             init() {
         // Настройка рендера
         this.renderer.setSize(window.innerWidth, window.innerHeight)
         this.renderer.setClearColor(0x87CEEB, 1) // Небесно-голубой
         this.renderer.shadowMap.enabled = true
         this.renderer.shadowMap.type = THREE.PCFSoftShadowMap
         this.renderer.physicallyCorrectLights = true
         
         const container = document.getElementById('office-container')
         container.appendChild(this.renderer.domElement)
         
         // Позиция камеры снаружи офиса для обзора всей сцены  
         this.camera.position.set(6, 4, 6) // Камера высоко и снаружи офиса
         this.camera.lookAt(0, 0, 0) // Смотрим в центр офиса
         
         window.addEventListener('resize', () => this.handleResize())
       }
       
       createOfficeStructure() {
         // Пол (8м × 6м)
         const floorGeometry = new THREE.PlaneGeometry(8, 6)
         const floorMaterial = new THREE.MeshLambertMaterial({ 
           color: 0x8B4513
         })
         const floor = new THREE.Mesh(floorGeometry, floorMaterial)
         floor.rotation.x = -Math.PI / 2
         floor.receiveShadow = true
         this.scene.add(floor)
         
         // Стены
         this.createWalls()
         
         // Потолок
         const ceilingGeometry = new THREE.PlaneGeometry(8, 6)
         const ceilingMaterial = new THREE.MeshLambertMaterial({ color: 0xF5F5F5 })
         const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial)
         ceiling.rotation.x = Math.PI / 2
         ceiling.position.y = 3
         this.scene.add(ceiling)
       }
       
       createWalls() {
         const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xE6E6FA })
         
         // Задняя стена
         const backWallGeometry = new THREE.PlaneGeometry(8, 3)
         const backWall = new THREE.Mesh(backWallGeometry, wallMaterial)
         backWall.position.set(0, 1.5, -3)
         this.scene.add(backWall)
         
         // Левая стена
         const leftWallGeometry = new THREE.PlaneGeometry(6, 3)
         const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial)
         leftWall.position.set(-4, 1.5, 0)
         leftWall.rotation.y = Math.PI / 2
         this.scene.add(leftWall)
         
         // Правая стена
         const rightWallGeometry = new THREE.PlaneGeometry(6, 3)
         const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial)
         rightWall.position.set(4, 1.5, 0)
         rightWall.rotation.y = -Math.PI / 2
         this.scene.add(rightWall)
         
         // Окно
         this.createWindow()
       }
       
       createWindow() {
         const windowGeometry = new THREE.PlaneGeometry(2, 1.5)
         const windowMaterial = new THREE.MeshBasicMaterial({ 
           color: 0x87CEEB,
           transparent: true,
           opacity: 0.7
         })
         const window = new THREE.Mesh(windowGeometry, windowMaterial)
         window.position.set(2, 1.8, 2.99)
         this.scene.add(window)
       }
       
              createFurniture() {
         // Главный стол
         this.createDesk(-1, 0, -1.5)
         
         // Стул
         this.createChair(-1, 0, -0.5)
         
         // Растение
         this.createPlant(-3, 0, 2)
       }
       
       createDesk(x, y, z) {
         const group = new THREE.Group()
         
         // Столешница
         const topGeometry = new THREE.BoxGeometry(1.5, 0.05, 0.8)
         const topMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
         const top = new THREE.Mesh(topGeometry, topMaterial)
         top.position.y = 0.75
         top.castShadow = true
         top.receiveShadow = true
         group.add(top)
         
         // Ножки стола
         for (let i = 0; i < 4; i++) {
           const legGeometry = new THREE.CylinderGeometry(0.03, 0.03, 0.75)
           const legMaterial = new THREE.MeshLambertMaterial({ color: 0x654321 })
           const leg = new THREE.Mesh(legGeometry, legMaterial)
           
           const xPos = (i % 2) * 1.4 - 0.7
           const zPos = Math.floor(i / 2) * 0.7 - 0.35
           leg.position.set(xPos, 0.375, zPos)
           leg.castShadow = true
           group.add(leg)
         }
         
         group.position.set(x, y, z)
         this.scene.add(group)
         
         // Монитор на столе
         this.createMonitor(x, y + 0.8, z)
       }
       
       createMonitor(x, y, z) {
         const group = new THREE.Group()
         
         // Экран
         const screenGeometry = new THREE.BoxGeometry(0.6, 0.4, 0.05)
         const screenMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 })
         const screen = new THREE.Mesh(screenGeometry, screenMaterial)
         group.add(screen)
         
         group.position.set(x, y, z - 0.2)
         group.castShadow = true
         this.scene.add(group)
       }
       
       createChair(x, y, z) {
         const group = new THREE.Group()
         
         // Сиденье
         const seatGeometry = new THREE.BoxGeometry(0.5, 0.05, 0.5)
         const seatMaterial = new THREE.MeshLambertMaterial({ color: 0x4169E1 })
         const seat = new THREE.Mesh(seatGeometry, seatMaterial)
         seat.position.y = 0.45
         seat.castShadow = true
         group.add(seat)
         
         group.position.set(x, y, z)
         this.scene.add(group)
       }
       
       createPlant(x, y, z) {
         const group = new THREE.Group()
         
         // Горшок
         const potGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.2)
         const potMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
         const pot = new THREE.Mesh(potGeometry, potMaterial)
         pot.position.y = 0.1
         pot.castShadow = true
         group.add(pot)
         
         // Растение
         for (let i = 0; i < 8; i++) {
           const leafGeometry = new THREE.SphereGeometry(0.1, 8, 8)
           const leafMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 })
           const leaf = new THREE.Mesh(leafGeometry, leafMaterial)
           
           const angle = (i / 8) * Math.PI * 2
           leaf.position.set(
             Math.cos(angle) * 0.1,
             0.2 + Math.random() * 0.3,
             Math.sin(angle) * 0.1
           )
           leaf.castShadow = true
           group.add(leaf)
         }
         
         group.position.set(x, y, z)
         this.scene.add(group)
       }
       
       setupLighting() {
         // Ambient light
         this.ambientLight = new THREE.AmbientLight(0x404040, 0.3)
         this.scene.add(this.ambientLight)
         
         // Главный свет (солнце)
         this.sunLight = new THREE.DirectionalLight(0xffffff, 1)
         this.sunLight.position.set(10, 10, 5)
         this.sunLight.castShadow = true
         this.scene.add(this.sunLight)
       }
       
       setupControls() {
                 this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement)
        this.controls.target.set(0, 1, 0) // Смотрим в центр офиса на уровне стола
        this.controls.enableDamping = true
        this.controls.dampingFactor = 0.05
        this.controls.minDistance = 2
        this.controls.maxDistance = 20
        this.controls.maxPolarAngle = Math.PI * 0.8 // Не даем камере уйти под пол
        console.log('🎮 OrbitControls настроены:', {
          target: this.controls.target,
          minDistance: this.controls.minDistance,
          maxDistance: this.controls.maxDistance
        })
         
                 this.controls.update() // Обновляем контролы
         
         console.log('✅ OrbitControls настроены. Позиция камеры:', this.camera.position)
         console.log('🎯 Target камеры:', this.controls.target)
       }
       
             loadInitialHumanoids() {
        console.log('🤖 Создаем красивых виртуальных сотрудников...')
        
        // Сначала пробуем GLB ботов, если не получится - используем placeholder
        this.loadGLBEmployees()
        
        // Placeholder как fallback
        setTimeout(() => {
          if (this.humanoids.length === 0) {
            console.log('⚠️ GLB не загрузился, используем placeholder')
            this.createPlaceholderHumanoids()
          }
          this.updateStats()
        }, 3000) // Даем 3 секунды на загрузку GLB
        
        console.log('✅ Виртуальные сотрудники создаются...')
      }
       
       loadGLBEmployees() {
        console.log('🤖 Загружаем GLB ботов...')
        
        this.gltfLoader.load('/assets/models/humanoids/bots.glb',
          (gltf) => {
            console.log('✅ GLB модель загружена!', gltf.scene.children.length, 'объектов')
            
            // Анализируем размеры модели
            const box = new THREE.Box3().setFromObject(gltf.scene)
            const size = box.getSize(new THREE.Vector3())
            const center = box.getCenter(new THREE.Vector3())
            
            console.log('📏 Размеры GLB модели:', {
              width: size.x.toFixed(2),
              height: size.y.toFixed(2), 
              depth: size.z.toFixed(2),
              center: { x: center.x.toFixed(2), y: center.y.toFixed(2), z: center.z.toFixed(2) }
            })
            
            // Определяем нужный масштаб (целевая высота ~1.8м)
            const targetHeight = 1.8
            const currentHeight = size.y
            const optimalScale = currentHeight > 0 ? targetHeight / currentHeight : 1.0
            
            console.log('🎯 Оптимальный масштаб:', optimalScale.toFixed(2))
            
            // Проходим по всем найденным ботам в GLB файле
            gltf.scene.traverse((child) => {
              if (child.isMesh) {
                console.log('Найден mesh:', child.name, child.material?.name)
                child.castShadow = true
                child.receiveShadow = true
              }
            })
            
            // Центрируем модель перед клонированием
            gltf.scene.position.set(-center.x, -center.y, -center.z)
            
            // Клонируем модель для двух ботов с правильным масштабом
            const bot1 = gltf.scene.clone()
            bot1.scale.set(optimalScale, optimalScale, optimalScale)
            bot1.position.set(2, 0, 1) // Позиция на полу офиса
            
            // Добавляем отладочный wireframe для первого бота
            const bot1Box = new THREE.BoxHelper(bot1, 0xff0000)
            this.scene.add(bot1Box)
            console.log('🔴 Бот 1 - позиция:', bot1.position, 'масштаб:', bot1.scale)
            
            this.scene.add(bot1)
            
            const bot2 = gltf.scene.clone()  
            bot2.scale.set(optimalScale, optimalScale, optimalScale)
            bot2.position.set(-2, 0, -1) // Позиция на полу офиса
            
            // Добавляем отладочный wireframe для второго бота
            const bot2Box = new THREE.BoxHelper(bot2, 0x00ff00)
            this.scene.add(bot2Box)
            console.log('🟢 Бот 2 - позиция:', bot2.position, 'масштаб:', bot2.scale)
            
            this.scene.add(bot2)
            
            // Добавляем большие маркеры для отладки позиций
            const marker1 = new THREE.Mesh(
              new THREE.SphereGeometry(0.2),
              new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true })
            )
            marker1.position.set(2, 2, 1) // Над первым ботом
            this.scene.add(marker1)
            
            const marker2 = new THREE.Mesh(
              new THREE.SphereGeometry(0.2),
              new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true })
            )
            marker2.position.set(-2, 2, -1) // Над вторым ботом
            this.scene.add(marker2)
            
            // Добавляем в массив
            this.humanoids.push({
              name: 'GLB Bot Alpha',
              object: bot1,
              mixer: null,
              position: { x: 2, y: 0, z: 1 },
              isPlaceholder: false
            })
            
            this.humanoids.push({
              name: 'GLB Bot Beta', 
              object: bot2,
              mixer: null,
              position: { x: -2, y: 0, z: -1 },
              isPlaceholder: false
            })
            
            console.log('🎉 GLB боты успешно загружены!', this.humanoids.length)
            this.updateStats()
          },
          (progress) => {
            const percent = Math.round((progress.loaded / progress.total) * 100)
            console.log('⏳ Загрузка GLB:', percent + '%')
          },
          (error) => {
            console.warn('⚠️ Ошибка загрузки GLB ботов:', error)
            console.log('🔄 Используем placeholder сотрудников...')
            this.createPlaceholderHumanoids()
            this.updateStats()
          }
        )
      }
       
       createPlaceholderHumanoids() {
         // Создаем простых геометрических гуманоидов
         this.createPlaceholderHumanoid('Alpha', { x: 2, y: 0, z: 1 }, 0xff6b6b)
         this.createPlaceholderHumanoid('Beta', { x: -2, y: 0, z: -1 }, 0x4ecdc4)
         
         console.log('✅ Placeholder сотрудники созданы!', this.humanoids.length)
       }
       
       createPlaceholderHumanoid(name, position, color) {
         const group = new THREE.Group()
         
         // Тело (цилиндр)
         const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.2)
         const bodyMaterial = new THREE.MeshLambertMaterial({ color: color })
         const body = new THREE.Mesh(bodyGeometry, bodyMaterial)
         body.position.y = 0.6
         body.castShadow = true
         group.add(body)
         
         // Голова (сфера)
         const headGeometry = new THREE.SphereGeometry(0.2)
         const headMaterial = new THREE.MeshLambertMaterial({ color: 0xffdbac })
         const head = new THREE.Mesh(headGeometry, headMaterial)
         head.position.y = 1.4
         head.castShadow = true
         group.add(head)
         
         // Руки
         for (let i = 0; i < 2; i++) {
           const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.6)
           const armMaterial = new THREE.MeshLambertMaterial({ color: 0xffdbac })
           const arm = new THREE.Mesh(armGeometry, armMaterial)
           arm.position.set((i * 2 - 1) * 0.5, 0.9, 0)
           arm.castShadow = true
           group.add(arm)
         }
         
         // Ноги
         for (let i = 0; i < 2; i++) {
           const legGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8)
           const legMaterial = new THREE.MeshLambertMaterial({ color: 0x2c3e50 })
           const leg = new THREE.Mesh(legGeometry, legMaterial)
           leg.position.set((i * 2 - 1) * 0.2, 0.4, 0)
           leg.castShadow = true
           group.add(leg)
         }
         
         // Позиционируем группу
         group.position.set(position.x, position.y, position.z)
         group.scale.setScalar(0.8)
         
         // Простая анимация покачивания
         group.userData = {
           name: name,
           originalY: position.y,
           time: Math.random() * Math.PI * 2
         }
         
         this.scene.add(group)
         
         const humanoidData = {
           name,
           object: group,
           mixer: null, // Простая анимация без миксера
           position,
           isPlaceholder: true
         }
         
         this.humanoids.push(humanoidData)
         return humanoidData
       }
       
       animate() {
         try {
           // Проверяем что все компоненты инициализированы
           if (!this.renderer || !this.scene || !this.camera) {
             console.error('❌ Критические компоненты не инициализированы, останавливаем анимацию')
             return
           }
           
           requestAnimationFrame(() => this.animate())
           
           this.frameCount++
           const now = performance.now()
           const deltaTime = Math.min((now - this.lastTime) / 1000, 0.1) // Ограничиваем deltaTime
           this.lastTime = now
           
           // Обновляем анимации гуманоидов с защитой
           const animationDelta = this.clock ? this.clock.getDelta() : 0
           
           if (this.mixers && Array.isArray(this.mixers)) {
             this.mixers.forEach(mixer => {
               if (mixer && typeof mixer.update === 'function') {
                 mixer.update(animationDelta)
               }
             })
           }
           
           // Простая анимация для placeholder гуманоидов с защитой
           if (this.humanoids && Array.isArray(this.humanoids)) {
             this.humanoids.forEach(humanoid => {
               if (humanoid && humanoid.isPlaceholder && humanoid.object && humanoid.object.userData) {
                 humanoid.object.userData.time += animationDelta
                 const bobOffset = Math.sin(humanoid.object.userData.time * 2) * 0.05
                 humanoid.object.position.y = humanoid.object.userData.originalY + bobOffset
               }
             })
           }
           
           // Обновляем контролы с защитой
           if (this.controls && typeof this.controls.update === 'function') {
             this.controls.update()
           }
           
           // Рендер с защитой
           this.renderer.render(this.scene, this.camera)
           
           // Обновляем FPS и статистику каждые 60 кадров
           if (this.frameCount % 60 === 0) {
             const fps = Math.round(1 / deltaTime) || 60
             const fpsElement = document.getElementById('fps')
             const objectsElement = document.getElementById('objects') 
             const humanoidsElement = document.getElementById('humanoids')
             
             if (fpsElement) fpsElement.textContent = fps
             if (objectsElement) objectsElement.textContent = this.scene.children.length
             if (humanoidsElement) humanoidsElement.textContent = this.humanoids ? this.humanoids.length : 0
           }
           
         } catch (error) {
           console.error('❌ Критическая ошибка в цикле анимации:', error)
           console.error('Стек ошибки:', error.stack)
           // Останавливаем анимацию при критической ошибке
           return
         }
       }
       
       handleResize() {
         this.camera.aspect = window.innerWidth / window.innerHeight
         this.camera.updateProjectionMatrix()
         this.renderer.setSize(window.innerWidth, window.innerHeight)
       }
       
       // Публичные методы для кнопок
       addWorkstation() {
         const x = (Math.random() - 0.5) * 6
         const z = (Math.random() - 0.5) * 4
         this.createDesk(x, 0, z)
         this.createChair(x, 0, z + 1)
         this.workstations.push({x, z})
       }
       
       addMetaScreen() {
         const group = new THREE.Group()
         
         const screenGeometry = new THREE.PlaneGeometry(1.5, 1)
         const screenMaterial = new THREE.MeshBasicMaterial({ 
           color: 0x000033,
           transparent: true,
           opacity: 0.9
         })
         const screen = new THREE.Mesh(screenGeometry, screenMaterial)
         group.add(screen)
         
         group.position.set(
           (Math.random() - 0.5) * 6,
           1.5,
           -2.8
         )
         
         this.scene.add(group)
         this.metaScreens.push(group)
       }
       
       toggleLighting() {
         this.lightingEnabled = !this.lightingEnabled
         this.sunLight.intensity = this.lightingEnabled ? 1 : 0.1
         document.getElementById('lights').textContent = this.lightingEnabled ? 'Включено' : 'Выключено'
       }
       
       toggleDay() {
         this.isDayTime = !this.isDayTime
         
         if (this.isDayTime) {
           this.renderer.setClearColor(0x87CEEB, 1)
           this.sunLight.intensity = 1
           document.getElementById('time').textContent = '12:00'
         } else {
           this.renderer.setClearColor(0x191970, 1)
           this.sunLight.intensity = 0.1
           document.getElementById('time').textContent = '22:00'
         }
       }
       
       addHumanoid() {
         // Случайная позиция в офисе
         const position = {
           x: (Math.random() - 0.5) * 6,
           y: 0,
           z: (Math.random() - 0.5) * 4
         }
         
         const name = `Employee_${Date.now()}`
         const colors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf9ca24, 0xf0932b, 0xeb4d4b, 0x6c5ce7]
         const randomColor = colors[Math.floor(Math.random() * colors.length)]
         
         const humanoid = this.createPlaceholderHumanoid(name, position, randomColor)
         
         console.log(`✅ Добавлен новый сотрудник: ${name}`)
         this.updateStats()
         
         return humanoid
       }
       
       updateStats() {
         if (document.getElementById('humanoids')) {
           document.getElementById('humanoids').textContent = this.humanoids.length
         }
         if (document.getElementById('objects')) {
           document.getElementById('objects').textContent = this.scene.children.length
         }
       }
     }
     
     // Глобальные функции для кнопок
     window.addWorkstation = () => window.office?.addWorkstation()
     window.toggleLighting = () => window.office?.toggleLighting()
     window.addMetaScreen = () => window.office?.addMetaScreen()
     window.addHumanoid = () => window.office?.addHumanoid()
     window.toggleDay = () => window.office?.toggleDay()
  </script>
</body>
