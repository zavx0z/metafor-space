<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaFor Virtual Office - Виртуальный офис</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    
    #office-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      backdrop-filter: blur(10px);
    }
    
    #ui-overlay h1 {
      margin: 0 0 15px 0;
      font-size: 1.8em;
      color: #00d4ff;
    }
    
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      backdrop-filter: blur(10px);
    }
    
    button {
      background: linear-gradient(45deg, #00d4ff, #0080ff);
      border: none;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
    }

    #info {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      backdrop-filter: blur(10px);
      font-family: monospace;
      font-size: 12px;
      max-width: 250px;
    }
  </style>
</head>
<body>
  <div id="office-container"></div>
  
  <div id="ui-overlay">
    <h1>Virtual Office</h1>
    <p>Виртуальный офис MetaFor</p>
    <p><strong>Размер:</strong> 8м × 6м × 3м</p>
    <p><strong>Освещение:</strong> Дневной свет + точечные источники</p>
    <p><strong>Управление:</strong> Мышь для вращения камеры</p>
  </div>
  
  <div id="controls">
    <button onclick="addWorkstation()">Добавить рабочее место</button>
    <button onclick="toggleLighting()">Освещение</button>
    <button onclick="addMetaScreen()">MetaFor экран</button>
    <button onclick="toggleDay()">День/Ночь</button>
  </div>
  
  <div id="info">
    <div><strong>FPS:</strong> <span id="fps">60</span></div>
    <div><strong>Объекты:</strong> <span id="objects">0</span></div>
    <div><strong>Освещение:</strong> <span id="lights">Дневное</span></div>
    <div><strong>Время:</strong> <span id="time">12:00</span></div>
  </div>

  <script>
    // Виртуальный офис-студия MetaFor
    class VirtualOffice {
      constructor() {
        this.scene = new THREE.Scene()
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100)
        this.renderer = new THREE.WebGLRenderer({ antialias: true })
        this.controls = null
        
        this.workstations = []
        this.metaScreens = []
        this.isDayTime = true
        this.lightingEnabled = true
        
        this.frameCount = 0
        this.lastTime = performance.now()
        
        this.init()
        this.createOfficeStructure()
        this.createFurniture()
        this.setupLighting()
        this.setupControls()
        this.animate()
      }
      
             init() {
         // Настройка рендера
         this.renderer.setSize(window.innerWidth, window.innerHeight)
         this.renderer.setClearColor(0x87CEEB, 1) // Небесно-голубой
         this.renderer.shadowMap.enabled = true
         this.renderer.shadowMap.type = THREE.PCFSoftShadowMap
         this.renderer.physicallyCorrectLights = true
         
         const container = document.getElementById('office-container')
         container.appendChild(this.renderer.domElement)
         
         // Позиция камеры в центре комнаты
         this.camera.position.set(0, 1.7, 2) // Рост человека ~1.7м
         
         window.addEventListener('resize', () => this.handleResize())
       }
       
       createOfficeStructure() {
         // Пол (8м × 6м)
         const floorGeometry = new THREE.PlaneGeometry(8, 6)
         const floorMaterial = new THREE.MeshLambertMaterial({ 
           color: 0x8B4513
         })
         const floor = new THREE.Mesh(floorGeometry, floorMaterial)
         floor.rotation.x = -Math.PI / 2
         floor.receiveShadow = true
         this.scene.add(floor)
         
         // Стены
         this.createWalls()
         
         // Потолок
         const ceilingGeometry = new THREE.PlaneGeometry(8, 6)
         const ceilingMaterial = new THREE.MeshLambertMaterial({ color: 0xF5F5F5 })
         const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial)
         ceiling.rotation.x = Math.PI / 2
         ceiling.position.y = 3
         this.scene.add(ceiling)
       }
       
       createWalls() {
         const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xE6E6FA })
         
         // Задняя стена
         const backWallGeometry = new THREE.PlaneGeometry(8, 3)
         const backWall = new THREE.Mesh(backWallGeometry, wallMaterial)
         backWall.position.set(0, 1.5, -3)
         this.scene.add(backWall)
         
         // Левая стена
         const leftWallGeometry = new THREE.PlaneGeometry(6, 3)
         const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial)
         leftWall.position.set(-4, 1.5, 0)
         leftWall.rotation.y = Math.PI / 2
         this.scene.add(leftWall)
         
         // Правая стена
         const rightWallGeometry = new THREE.PlaneGeometry(6, 3)
         const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial)
         rightWall.position.set(4, 1.5, 0)
         rightWall.rotation.y = -Math.PI / 2
         this.scene.add(rightWall)
         
         // Окно
         this.createWindow()
       }
       
       createWindow() {
         const windowGeometry = new THREE.PlaneGeometry(2, 1.5)
         const windowMaterial = new THREE.MeshBasicMaterial({ 
           color: 0x87CEEB,
           transparent: true,
           opacity: 0.7
         })
         const window = new THREE.Mesh(windowGeometry, windowMaterial)
         window.position.set(2, 1.8, 2.99)
         this.scene.add(window)
       }
       
              createFurniture() {
         // Главный стол
         this.createDesk(-1, 0, -1.5)
         
         // Стул
         this.createChair(-1, 0, -0.5)
         
         // Растение
         this.createPlant(-3, 0, 2)
       }
       
       createDesk(x, y, z) {
         const group = new THREE.Group()
         
         // Столешница
         const topGeometry = new THREE.BoxGeometry(1.5, 0.05, 0.8)
         const topMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
         const top = new THREE.Mesh(topGeometry, topMaterial)
         top.position.y = 0.75
         top.castShadow = true
         top.receiveShadow = true
         group.add(top)
         
         // Ножки стола
         for (let i = 0; i < 4; i++) {
           const legGeometry = new THREE.CylinderGeometry(0.03, 0.03, 0.75)
           const legMaterial = new THREE.MeshLambertMaterial({ color: 0x654321 })
           const leg = new THREE.Mesh(legGeometry, legMaterial)
           
           const xPos = (i % 2) * 1.4 - 0.7
           const zPos = Math.floor(i / 2) * 0.7 - 0.35
           leg.position.set(xPos, 0.375, zPos)
           leg.castShadow = true
           group.add(leg)
         }
         
         group.position.set(x, y, z)
         this.scene.add(group)
         
         // Монитор на столе
         this.createMonitor(x, y + 0.8, z)
       }
       
       createMonitor(x, y, z) {
         const group = new THREE.Group()
         
         // Экран
         const screenGeometry = new THREE.BoxGeometry(0.6, 0.4, 0.05)
         const screenMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 })
         const screen = new THREE.Mesh(screenGeometry, screenMaterial)
         group.add(screen)
         
         group.position.set(x, y, z - 0.2)
         group.castShadow = true
         this.scene.add(group)
       }
       
       createChair(x, y, z) {
         const group = new THREE.Group()
         
         // Сиденье
         const seatGeometry = new THREE.BoxGeometry(0.5, 0.05, 0.5)
         const seatMaterial = new THREE.MeshLambertMaterial({ color: 0x4169E1 })
         const seat = new THREE.Mesh(seatGeometry, seatMaterial)
         seat.position.y = 0.45
         seat.castShadow = true
         group.add(seat)
         
         group.position.set(x, y, z)
         this.scene.add(group)
       }
       
       createPlant(x, y, z) {
         const group = new THREE.Group()
         
         // Горшок
         const potGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.2)
         const potMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
         const pot = new THREE.Mesh(potGeometry, potMaterial)
         pot.position.y = 0.1
         pot.castShadow = true
         group.add(pot)
         
         // Растение
         for (let i = 0; i < 8; i++) {
           const leafGeometry = new THREE.SphereGeometry(0.1, 8, 8)
           const leafMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 })
           const leaf = new THREE.Mesh(leafGeometry, leafMaterial)
           
           const angle = (i / 8) * Math.PI * 2
           leaf.position.set(
             Math.cos(angle) * 0.1,
             0.2 + Math.random() * 0.3,
             Math.sin(angle) * 0.1
           )
           leaf.castShadow = true
           group.add(leaf)
         }
         
         group.position.set(x, y, z)
         this.scene.add(group)
       }
       
       setupLighting() {
         // Ambient light
         this.ambientLight = new THREE.AmbientLight(0x404040, 0.3)
         this.scene.add(this.ambientLight)
         
         // Главный свет (солнце)
         this.sunLight = new THREE.DirectionalLight(0xffffff, 1)
         this.sunLight.position.set(10, 10, 5)
         this.sunLight.castShadow = true
         this.scene.add(this.sunLight)
       }
       
       setupControls() {
         this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement)
         this.controls.enableDamping = true
         this.controls.dampingFactor = 0.05
         this.controls.maxPolarAngle = Math.PI / 2 - 0.1
         this.controls.maxDistance = 8
         this.controls.minDistance = 1
       }
       
       animate() {
         requestAnimationFrame(() => this.animate())
         
         this.frameCount++
         const deltaTime = (performance.now() - this.lastTime) / 1000
         this.lastTime = performance.now()
         
         // Обновляем контролы
         if (this.controls) {
           this.controls.update()
         }
         
         // Рендер
         this.renderer.render(this.scene, this.camera)
         
         // Обновляем FPS
         if (this.frameCount % 60 === 0) {
           const fps = Math.round(1 / deltaTime) || 60
           document.getElementById('fps').textContent = fps
           document.getElementById('objects').textContent = this.scene.children.length
         }
       }
       
       handleResize() {
         this.camera.aspect = window.innerWidth / window.innerHeight
         this.camera.updateProjectionMatrix()
         this.renderer.setSize(window.innerWidth, window.innerHeight)
       }
       
       // Публичные методы для кнопок
       addWorkstation() {
         const x = (Math.random() - 0.5) * 6
         const z = (Math.random() - 0.5) * 4
         this.createDesk(x, 0, z)
         this.createChair(x, 0, z + 1)
         this.workstations.push({x, z})
       }
       
       addMetaScreen() {
         const group = new THREE.Group()
         
         const screenGeometry = new THREE.PlaneGeometry(1.5, 1)
         const screenMaterial = new THREE.MeshBasicMaterial({ 
           color: 0x000033,
           transparent: true,
           opacity: 0.9
         })
         const screen = new THREE.Mesh(screenGeometry, screenMaterial)
         group.add(screen)
         
         group.position.set(
           (Math.random() - 0.5) * 6,
           1.5,
           -2.8
         )
         
         this.scene.add(group)
         this.metaScreens.push(group)
       }
       
       toggleLighting() {
         this.lightingEnabled = !this.lightingEnabled
         this.sunLight.intensity = this.lightingEnabled ? 1 : 0.1
         document.getElementById('lights').textContent = this.lightingEnabled ? 'Включено' : 'Выключено'
       }
       
       toggleDay() {
         this.isDayTime = !this.isDayTime
         
         if (this.isDayTime) {
           this.renderer.setClearColor(0x87CEEB, 1)
           this.sunLight.intensity = 1
           document.getElementById('time').textContent = '12:00'
         } else {
           this.renderer.setClearColor(0x191970, 1)
           this.sunLight.intensity = 0.1
           document.getElementById('time').textContent = '22:00'
         }
       }
     }
     
     // Глобальные функции для кнопок
     let office
     
     window.addWorkstation = () => office.addWorkstation()
     window.toggleLighting = () => office.toggleLighting()
     window.addMetaScreen = () => office.addMetaScreen()
     window.toggleDay = () => office.toggleDay()
     
     // Инициализация офиса
     office = new VirtualOffice()
     
     console.log(`
     🏢 MetaFor Virtual Office запущен!
     
     ✅ Офис-студия 8м × 6м × 3м создан
     ✅ Базовая мебель размещена
     ✅ Освещение настроено
     ✅ Интерактивность добавлена
     
     Управление:
     - Мышь: вращение камеры
     - Колесо: приближение/отдаление
     - Кнопки: добавление объектов
     `)
  </script>
</body>
</html>
