<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>input-enum storybook</title>
  <link rel="stylesheet" href="/theme/theme.css"/>
  <script type="module">
    import "./input-enum.js"
    import {html, render} from "../html/html.js"

    render(html`
      <h2>enum (options массив)</h2>
      <section>
        <metafor-input-enum context=${{
          name: "key11",
          title: "Варианты (options)",
          value: "two",
          options: ["one", "two", "three"]
        }}>
        </metafor-input-enum>
      </section>
      <h2>enum (options пустой)</h2>
      <section>
        <metafor-input-enum context=${{
          name: "key12",
          title: "Варианты (options пустой)",
          value: "",
          options: []
        }}>
        </metafor-input-enum>
      </section>
    `, document.body)
  </script>
  <style>
    body {
      display: flex;
      flex-direction: column;
    }

    section {
      background: rgba(var(--surface-700));
      padding: 4px 8px;
      display: flex;
      border-radius: 8px;
      flex-direction: row;
      align-items: center;
      min-width: max-content;
      height: fit-content;
      margin-bottom: 8px;
    }

    h2 {
      color: var(--font-color);
      font-size: 1em;
      margin: 0 0 4px 0;
      font-weight: 400;
    }
  </style>
</head>
<body></body>
</html>
