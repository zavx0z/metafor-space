<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>input-array storybook</title>
  <link rel="stylesheet" href="/theme/theme.css"/>
  <script type="module">
    import "./input-array.js"
    import {html, render} from "../html/html.js"

    render(html`
      <h2>array (массив строк)</h2>
      <section>
        <metafor-input-array context=${{
          name: "key6",
          title: "Массив",
          value: ["a", "b", "c"]
        }}></metafor-input-array>
      </section>
      <h2>array (пустой)</h2>
      <section>
        <metafor-input-array context=${{
          name: "key7",
          title: "Пустой массив",
          value: []
        }}></metafor-input-array>
      </section>
    `, document.body)
  </script>
  <style>
    body {
      display: flex;
      flex-direction: column;
    }

    section {
      background: rgba(var(--surface-700));
      padding: 4px 8px;
      display: flex;
      border-radius: 8px;
      flex-direction: row;
      align-items: center;
      min-width: max-content;
      height: fit-content;
      margin-bottom: 8px;
    }

    h2 {
      color: var(--font-color);
      font-size: 1em;
      margin: 0 0 4px 0;
      font-weight: 400;
    }
  </style>
</head>
<body></body>
</html>
